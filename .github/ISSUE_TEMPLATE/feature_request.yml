# 根据 https://github.com/unif-design/.github/blob/2a6e991697447f91127664eafb7aea80d5751194/templates/ISSUE_TEMPLATE/feature_request.yml 做原生鸿蒙适配。
name: 功能需求
description: 描述具体场景、目标行为和影响范围。
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请说明现有日志能力的具体缺口、受影响入口及必要生命周期，不以需求提交代替开发或发布授权。
  - type: textarea
    id: motivation
    attributes:
      label: 使用场景与问题
      description: 说明触发入口、当前行为和需要解决的问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 目标行为
      description: 说明期望结果、必要输入输出和验收方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已有能力与备选方案
      description: 说明已检查的可复用能力或可选方案；没有时可留空。
  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 列出受影响的使用场景、调用方、权限或外部服务；涉及不兼容变化时说明原因。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已检查现有 Issue，未找到相同需求。
          required: true
        - label: 已说明具体目标行为和范围。
          required: true
